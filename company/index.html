<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会社概要｜薬剤師バンク</title>
<meta name="description" content="薬剤師バンクを運営する株式会社CiELの会社概要。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152A20;--green:#1C6B49;--green-deep:#124d34;--leaf:#2FA26A;
    --tint:#E9F3EC;--tint2:#F3F8F4;--paper:#FBFCFA;--muted:#5C6C63;
    --border:#D9E4DC;
    --disp:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --body:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.85;font-size:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:840px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-family:var(--disp);line-height:1.4;letter-spacing:.01em}
  a{color:inherit}

  header{position:sticky;top:0;z-index:50;background:rgba(251,252,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .hbar{display:flex;align-items:center;justify-content:space-between;height:62px;max-width:1040px;margin:0 auto;padding:0 20px}
  .logo{font-family:var(--disp);font-weight:900;font-size:20px;color:var(--green);display:flex;align-items:center;gap:6px;text-decoration:none}
  .logo .mark{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--green);color:#fff;border-radius:7px;font-size:17px}

  .crumb{padding:26px 0 0;font-size:13px;color:var(--muted)}
  .crumb a{color:var(--green);text-decoration:none}
  .crumb a:hover{text-decoration:underline}

  h1.page-title{font-size:clamp(26px,4vw,36px);font-weight:900;margin:14px 0 30px}

  .info-table{border-top:1px solid var(--border)}
  .row{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--border)}
  .row .k{font-weight:700;color:var(--ink)}
  .row .v{color:var(--ink)}
  .row .v div{margin-bottom:2px}
  .row .v div:last-child{margin-bottom:0}
  @media(max-width:560px){.row{grid-template-columns:1fr;gap:6px;padding:18px 0}.row .k{color:var(--green);font-size:13.5px}}

  footer{background:var(--ink);color:#9fb4a8;padding:40px 0 50px;font-size:13px;border-top:1px solid rgba(255,255,255,.08);margin-top:50px}
  footer .wrap{max-width:1040px}
  footer a{color:#cfe0d6;text-decoration:none;margin-right:18px}
  footer a:hover{color:#fff}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <a href="../index.html" class="logo"><span class="mark">＋</span>薬剤師バンク</a>
  </div>
</header>

<div class="wrap">
  <p class="crumb"><a href="../index.html">TOP</a> / 会社概要</p>
  <h1 class="page-title">会社概要</h1>

  <div class="info-table">
    <div class="row"><div class="k">法人名</div><div class="v">株式会社CiEL</div></div>
    <div class="row"><div class="k">事業内容</div><div class="v"><div>有料職業紹介業</div><div>フリーランスのマッチングおよびプラットフォームの運営</div></div></div>
    <div class="row"><div class="k">有料職業紹介<br>事業許可番号</div><div class="v">08-ユ-300444</div></div>
    <div class="row"><div class="k">所在地</div><div class="v">〒309-1611<br>茨城県笠間市吉岡259-28</div></div>
    <div class="row"><div class="k">電話番号</div><div class="v">ご請求があった場合は電話番号を遅滞なくご提供いたします。</div></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div style="margin-bottom:10px">
      <a href="../index.html">TOP</a>
      <a href="../pharmacy/index.html">薬局の方へ</a>
      <a href="../pharmacist/">薬剤師の方へ</a>
      <a href="../magazine/">マガジン</a>
    </div>
    <div>株式会社CiEL　｜　有料職業紹介事業許可番号：08-ユ-300444　｜　© 薬剤師バンク</div>
  </div>
</footer>

</body>
</html>
